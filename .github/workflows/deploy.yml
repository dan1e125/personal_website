name: Deploy to Cloudflare Pages

# Auto-deploy disabled — site taken offline 2026-08-26.
# Manual runs are also blocked. Re-enable only if the site should go live again.
on:
  workflow_dispatch:

jobs:
  deploy:
    if: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    name: Deploy
    steps:
      - uses: actions/checkout@v4
      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 19eb67b5a37cc6b3795a2d4221228140
          command: pages deploy . --project-name=danieloa --branch=main
